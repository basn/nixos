# yaml-language-server: $schema=https://version-2026-8.goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: PinePods
  labels:
    blueprints.goauthentik.io/description: PinePods OIDC application restricted to the pinepods group
entries:
  - model: authentik_core.group
    id: pinepods-group
    state: created
    identifiers:
      name: pinepods
    attrs:
      users:
        - !Find [authentik_core.user, [username, basn]]

  - model: authentik_providers_oauth2.oauth2provider
    id: pinepods-provider
    identifiers:
      name: PinePods
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: pinepods
      client_secret: !Env PINEPODS_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://pods.basn.se/api/auth/callback
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: pinepods-application
    identifiers:
      slug: pinepods
    attrs:
      name: PinePods
      provider: !KeyOf pinepods-provider
      policy_engine_mode: any
      meta_launch_url: https://pods.basn.se

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pinepods-application
      order: 0
    attrs:
      group: !KeyOf pinepods-group
